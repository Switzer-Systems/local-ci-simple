name: Trust contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify diff hygiene
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "${BASE_SHA}...${GITHUB_SHA}"
          elif [[ -n "${BEFORE_SHA}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git diff --check "${BEFORE_SHA}...${GITHUB_SHA}"
          else
            git diff --check "${GITHUB_SHA}^...${GITHUB_SHA}"
          fi

      - name: Install pinned static-analysis tools
        shell: bash
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          SHELLCHECK_VERSION: '0.11.0'
          SHELLCHECK_SHA256: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/ci-tools"
          mkdir -p "$bin_dir"

          actionlint_archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check --strict
          tar -xzf "$actionlint_archive" -C "$bin_dir" actionlint

          shellcheck_archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$shellcheck_archive" | sha256sum --check --strict
          tar -xJf "$shellcheck_archive" -C "$RUNNER_TEMP"
          install -m 0755 "${RUNNER_TEMP}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$bin_dir/shellcheck"

          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Run contract tests
        run: npm test

      - name: Validate preflight shell syntax
        run: bash -n scripts/preflight-github.sh

      - name: Run ShellCheck
        run: shellcheck --shell=bash scripts/preflight-github.sh

      - name: Run actionlint
        run: actionlint -shellcheck="$(command -v shellcheck)"

      - name: Run zizmor offline
        shell: bash
        env:
          ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284
        run: |
          set -euo pipefail
          docker run --rm \
            --network none \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/repo,readonly" \
            "$ZIZMOR_IMAGE" \
            --offline \
            --strict-collection \
            --collect=workflows \
            --persona=regular \
            --format=github \
            /repo
